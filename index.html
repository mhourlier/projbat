
<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#eaf3f8">

<title>Télécommande du bateau</title>

<style>

* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #eaf3f8;
    color: #263746;
}

button {
    font-family: inherit;
    cursor: pointer;
    border: none;
}

.topbar {
    max-width: 1100px;
    margin: 0 auto 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

h1 {
    color: #12649a;
    font-size: 25px;
    margin: 0 0 5px;
}

.subtitle {
    color: #607786;
    font-size: 13px;
    margin: 0;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

#status {
    font-size: 12px;
    font-weight: bold;
    color: #d94343;
    background: white;
    padding: 10px;
    border-radius: 8px;
}

#connectBtn,
#disconnectBtn {
    padding: 11px 15px;
    border-radius: 8px;
    color: white;
    font-size: 13px;
    font-weight: bold;
}

#connectBtn {
    background: #087dcc;
}

#disconnectBtn {
    background: #d94343;
    display: none;
}

.layout {
    max-width: 1100px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr;
    gap: 15px;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 3px 12px #0000000d;
}

.panel h2 {
    font-size: 17px;
    color: #12649a;
    margin: 0 0 18px;
}

.angle-number {
    text-align: center;
    font-size: 56px;
    font-weight: bold;
    color: #087dcc;
    margin: 5px 0;
}

.angle-description {
    text-align: center;
    color: #607786;
    font-size: 13px;
    margin-bottom: 24px;
}

.range-container {
    padding: 10px 3px;
}

input[type="range"] {
    width: 100%;
    height: 12px;
    cursor: pointer;
    accent-color: #087dcc;
    touch-action: pan-y;
}

.scale {
    display: flex;
    justify-content: space-between;
    color: #607786;
    font-size: 12px;
    margin-top: 12px;
}

.direction {
    display: flex;
    justify-content: space-between;
    margin-top: 18px;
    gap: 8px;
}

.direction span {
    background: #eaf3f8;
    padding: 9px;
    border-radius: 7px;
    text-align: center;
    font-size: 12px;
    flex: 1;
}

.controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.control-btn {
    padding: 20px 10px;
    font-size: 20px;
    font-weight: bold;
    color: #12649a;
    background: #eaf3f8;
    border-radius: 12px;
    transition: background 0.15s;
}

.control-btn:active {
    background: #b8d8eb;
}

.control-btn small {
    display: block;
    font-size: 11px;
    font-weight: normal;
    margin-top: 5px;
}

.center-btn {
    grid-column: span 2;
    background: #087dcc;
    color: white;
    padding: 18px;
    font-size: 16px;
}

.center-btn:active {
    background: #075b99;
}

button:disabled,
input:disabled {
    opacity: 0.45;
    cursor: not-allowed;
}

.info {
    max-width: 1100px;
    margin: 15px auto 0;
    text-align: center;
    color: #607786;
    font-size: 12px;
}

/* MODE PAYSAGE */

@media (orientation: landscape) and (min-width: 600px) {

    body {
        padding: 12px 20px;
    }

    .layout {
        grid-template-columns: 1.4fr 0.85fr;
        align-items: stretch;
    }

    .panel {
        min-height: 280px;
        padding: 22px;
    }

    .angle-number {
        font-size: 64px;
        margin: 8px 0;
    }

    .range-container {
        margin-top: 25px;
    }

    .controls-grid {
        gap: 15px;
    }

    .control-btn {
        padding: 22px 8px;
    }
}

/* PETIT ÉCRAN EN PAYSAGE */

@media (orientation: landscape) and (max-height: 500px) {

    body {
        padding: 7px 14px;
    }

    .topbar {
        margin-bottom: 8px;
    }

    h1 {
        font-size: 19px;
    }

    .panel {
        padding: 12px 18px;
        min-height: 0;
    }

    .panel h2 {
        margin-bottom: 8px;
    }

    .angle-number {
        font-size: 42px;
        margin: 0;
    }

    .angle-description {
        margin-bottom: 8px;
    }

    .range-container {
        margin-top: 8px;
    }

    .control-btn {
        padding: 12px 8px;
        font-size: 17px;
    }

    .center-btn {
        padding: 12px;
    }

    .info {
        margin-top: 7px;
    }
}

@media (max-width: 360px) {

    .topbar {
        align-items: flex-start;
        flex-direction: column;
    }

    .connection {
        justify-content: flex-start;
    }

}

</style>
</head>

<body>

<header class="topbar">

    <div>
        <h1>🚤 Télécommande du bateau</h1>
        <p class="subtitle">Pilotage Bluetooth de la barre</p>
    </div>

    <div class="connection">

        <div id="status">Déconnecté</div>

        <button id="connectBtn">
            Connecter
        </button>

        <button id="disconnectBtn">
            Déconnecter
        </button>

    </div>

</header>


<main class="layout">

    <!-- COMMANDE PRINCIPALE -->

    <section class="panel">

        <h2>Commande de direction</h2>

        <div class="angle-number">
            <span id="angleValue">90</span>°
        </div>

        <div class="angle-description" id="angleDescription">
            Position centrale
        </div>

        <div class="range-container">

            <input
                type="range"
                id="angleSlider"
                min="50"
                max="130"
                step="1"
                value="90"
                disabled
            >

            <div class="scale">
                <span>50°</span>
                <span>70°</span>
                <span>90°</span>
                <span>110°</span>
                <span>130°</span>
            </div>

        </div>

        <div class="direction">
            <span>← Gauche</span>
            <span>Centre</span>
            <span>Droite →</span>
        </div>

    </section>


    <!-- COMMANDES DE PRECISION -->

    <section class="panel">

        <h2>Réglage précis</h2>

        <div class="controls-grid">

            <button
                class="control-btn"
                id="minus5"
                disabled
            >
                −5°
                <small>Correction rapide</small>
            </button>

            <button
                class="control-btn"
                id="plus5"
                disabled
            >
                +5°
                <small>Correction rapide</small>
            </button>

            <button
                class="control-btn"
                id="minus1"
                disabled
            >
                −1°
                <small>Réglage fin</small>
            </button>

            <button
                class="control-btn"
                id="plus1"
                disabled
            >
                +1°
                <small>Réglage fin</small>
            </button>

            <button
                class="control-btn center-btn"
                id="centerBtn"
                disabled
            >
                ⊙ RETOUR AU CENTRE : 90°
            </button>

        </div>

    </section>

</main>

<div class="info">
    Déplace le curseur pour diriger le bateau.
    Utilise les boutons pour ajuster précisément la barre.
</div>


<script>

// --------------------------------------
// ELEMENTS DE LA PAGE
// --------------------------------------

const connectBtn = document.getElementById("connectBtn");
const disconnectBtn = document.getElementById("disconnectBtn");
const statusDiv = document.getElementById("status");

const angleSlider = document.getElementById("angleSlider");
const angleValue = document.getElementById("angleValue");
const angleDescription = document.getElementById("angleDescription");

const minus5 = document.getElementById("minus5");
const plus5 = document.getElementById("plus5");
const minus1 = document.getElementById("minus1");
const plus1 = document.getElementById("plus1");
const centerBtn = document.getElementById("centerBtn");


// --------------------------------------
// BLUETOOTH UART
// --------------------------------------

const UART_SERVICE_UUID =
"6e400001-b5a3-f393-e0a9-e50e24dcca9e";

// IMPORTANT : RX de la micro:bit = écriture depuis la page
const UART_RX_UUID =
"6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let bluetoothDevice = null;
let uartCharacteristic = null;


// --------------------------------------
// VARIABLES
// --------------------------------------

let currentAngle = 90;

let pendingAngle = null;
let sending = false;
let lastSentAngle = null;


// --------------------------------------
// AFFICHAGE DU STATUT
// --------------------------------------

function setStatus(message, color) {

    statusDiv.textContent = message;
    statusDiv.style.color = color;

}


// --------------------------------------
// ACTIVATION DES COMMANDES
// --------------------------------------

function setControlsEnabled(enabled) {

    angleSlider.disabled = !enabled;

    minus5.disabled = !enabled;
    plus5.disabled = !enabled;

    minus1.disabled = !enabled;
    plus1.disabled = !enabled;

    centerBtn.disabled = !enabled;

}


// --------------------------------------
// MISE A JOUR DE L'ANGLE
// --------------------------------------

function updateAngleDisplay(angle) {

    currentAngle = Math.max(
        50,
        Math.min(130, Math.round(angle))
    );

    angleSlider.value = currentAngle;
    angleValue.textContent = currentAngle;

    if (currentAngle < 90) {

        angleDescription.textContent = "Commande vers la gauche";

    } else if (currentAngle > 90) {

        angleDescription.textContent = "Commande vers la droite";

    } else {

        angleDescription.textContent = "Position centrale";

    }

}


// --------------------------------------
// CONNEXION BLUETOOTH
// --------------------------------------

connectBtn.addEventListener("click", async () => {

    if (!navigator.bluetooth) {

        setStatus(
            "Bluetooth non compatible",
            "#d94343"
        );

        return;

    }

    try {

        setStatus("Recherche de la micro:bit...", "#d68b00");

        bluetoothDevice = await navigator.bluetooth.requestDevice({

            filters: [
                { namePrefix: "BBC micro:bit" }
            ],

            optionalServices: [UART_SERVICE_UUID]

        });

        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            handleDisconnect
        );

        const server = await bluetoothDevice.gatt.connect();

        const service = await server.getPrimaryService(
            UART_SERVICE_UUID
        );

        uartCharacteristic = await service.getCharacteristic(
            UART_RX_UUID
        );

        console.log(
            "Caractéristique Bluetooth :",
            uartCharacteristic.properties
        );

        setStatus("Connecté !", "#219653");

        connectBtn.style.display = "none";
        disconnectBtn.style.display = "inline-block";

        setControlsEnabled(true);

        pendingAngle = null;
        lastSentAngle = null;

        updateAngleDisplay(90);

        // Envoi de la position centrale
        await sendAngle(90);

    } catch (error) {

        console.error(error);

        setStatus(
            "Erreur : " + error.message,
            "#d94343"
        );

    }

});


// --------------------------------------
// DECONNEXION
// --------------------------------------

disconnectBtn.addEventListener("click", () => {

    if (bluetoothDevice && bluetoothDevice.gatt.connected) {

        bluetoothDevice.gatt.disconnect();

    }

});


function handleDisconnect() {

    uartCharacteristic = null;

    pendingAngle = null;
    sending = false;
    lastSentAngle = null;

    setStatus("Déconnecté", "#d94343");

    connectBtn.style.display = "inline-block";
    disconnectBtn.style.display = "none";

    setControlsEnabled(false);

    updateAngleDisplay(90);

}


// --------------------------------------
// ENVOI BLUETOOTH
// --------------------------------------

async function sendAngle(angle) {

    if (!uartCharacteristic) return;

    angle = Math.max(
        50,
        Math.min(130, Math.round(angle))
    );

    pendingAngle = angle;

    if (sending) return;

    sending = true;

    while (pendingAngle !== null && uartCharacteristic) {

        const value = pendingAngle;
        pendingAngle = null;

        if (value === lastSentAngle) continue;

        try {

            const data = new TextEncoder().encode(
                String(value) + "\n"
            );

            const characteristic = uartCharacteristic;
            const properties = characteristic.properties;

            // Ecriture sans réponse
            if (
                properties.writeWithoutResponse &&
                typeof characteristic.writeValueWithoutResponse === "function"
            ) {

                await characteristic.writeValueWithoutResponse(data);

            }

            // Ecriture avec réponse
            else if (
                properties.write &&
                typeof characteristic.writeValueWithResponse === "function"
            ) {

                await characteristic.writeValueWithResponse(data);

            }

            // Ancienne méthode compatible
            else if (
                typeof characteristic.writeValue === "function"
            ) {

                await characteristic.writeValue(data);

            }

            else {

                throw new Error(
                    "Aucune méthode d'écriture Bluetooth disponible."
                );

            }

            lastSentAngle = value;

        } catch (error) {

            console.error("Erreur Bluetooth :", error);

            if (uartCharacteristic) {

                setStatus(
                    "Erreur d'envoi : " + error.message,
                    "#d94343"
                );

            }

            pendingAngle = null;
            break;

        }

    }

    sending = false;

}


// --------------------------------------
// COMMANDE PAR LE CURSEUR
// --------------------------------------

angleSlider.addEventListener("input", () => {

    const angle = Number(angleSlider.value);

    updateAngleDisplay(angle);

    sendAngle(angle);

});


// --------------------------------------
// BOUTONS DE REGLAGE
// --------------------------------------

function changeAngle(increment) {

    if (!uartCharacteristic) return;

    const newAngle = currentAngle + increment;

    updateAngleDisplay(newAngle);

    sendAngle(currentAngle);

}


minus5.addEventListener("click", () => {
    changeAngle(-5);
});

plus5.addEventListener("click", () => {
    changeAngle(5);
});

minus1.addEventListener("click", () => {
    changeAngle(-1);
});

plus1.addEventListener("click", () => {
    changeAngle(1);
});


// --------------------------------------
// RETOUR AU CENTRE
// --------------------------------------

centerBtn.addEventListener("click", () => {

    if (!uartCharacteristic) return;

    updateAngleDisplay(90);

    sendAngle(90);

});


// Initialisation
setControlsEnabled(false);
updateAngleDisplay(90);

</script>

</body>
</html>
