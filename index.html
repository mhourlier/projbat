<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Télécommande de Barre</title>
<style>
body { font-family: Arial, sans-serif; text-align: center; background-color: #f0f2f5; margin: 0; padding: 20px; }                                                                                            /* Style général de la page */
h1 { color: #333; }                                                                                                                                                                                          /* Style du titre */
button { padding: 12px 24px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; margin-bottom: 20px; }                                             /* Style du bouton */
button:hover { background-color: #0056b3; }                                                                                                                                                                  /* Effet au survol du bouton */
#status { font-weight: bold; margin-bottom: 20px; color: #d9534f; }                                                                                                                                          /* Style du texte d'état */
#joystick-container { position: relative; width: 200px; height: 200px; background-color: #e4e6eb; border-radius: 50%; margin: 0 auto; touch-action: none; }                                                  /* Zone grise du joystick */
#joystick { position: absolute; width: 80px; height: 80px; background-color: #007bff; border-radius: 50%; top: 60px; left: 60px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }                   /* Curseur mobile du joystick */
#angle-display { font-size: 20px; margin-top: 20px; color: #333; }                                                                                                                                           /* Affichage textuel de l'angle */
</style>
</head>
<body>

<h1>Télécommande de Barre</h1>
<button id="connectBtn">Connecter la micro:bit</button>                                                                                                                                                        <!-- Bouton de connexion -->
<div id="status">Statut : Déconnecté</div>                                                                                                                                                                     <!-- Indicateur d'état -->

<div id="joystick-container">                                                                                                                                                                                  <!-- Conteneur du joystick -->
<div id="joystick"></div>                                                                                                                                                                                      <!-- Poignée du joystick -->
</div>

<div id="angle-display">Angle de la barre : <span id="angleValue">90</span>°</div>                                                                                                                             <!-- Texte de l'angle en direct -->

<script>
let bluetoothDevice;                                                                                                                                                                                           // Stocke l'appareil micro:bit
let uartCharacteristic;                                                                                                                                                                                        // Canal de transmission Bluetooth UART

const connectBtn = document.getElementById('connectBtn');                                                                                                                                                      // Sélection du bouton HTML
const statusDiv = document.getElementById('status');                                                                                                                                                           // Sélection de la zone de statut
const joystick = document.getElementById('joystick');                                                                                                                                                          // Sélection du curseur joystick
const container = document.getElementById('joystick-container');                                                                                                                                               // Sélection du conteneur
const angleValueSpan = document.getElementById('angleValue');                                                                                                                                                  // Sélection du texte de l'angle

const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';                                                                                                                                              // UUID standard service UART
const UART_CHAR_RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';                                                                                                                                              // UUID standard écriture RX

connectBtn.addEventListener('click', async () => {                                                                                                                                                             // Action au clic sur connecter
try {
statusDiv.textContent = "Statut : Recherche...";                                                                                                                                                               // Message de recherche
bluetoothDevice = await navigator.bluetooth.requestDevice({                                                                                                                                                    // Ouvre la fenêtre d'appairage
filters: [{ namePrefix: 'BBC micro:bit' }],                                                                                                                                                                    // Filtre par nom micro:bit
optionalServices: [UART_SERVICE_UUID]                                                                                                                                                                          // Service optionnel requis
});

const server = await bluetoothDevice.gatt.connect();                                                                                                                                                           // Connexion au serveur GATT
const service = await server.getPrimaryService(UART_SERVICE_UUID);                                                                                                                                             // Récupération du service UART
uartCharacteristic = await service.getCharacteristic(UART_CHAR_RX_UUID);                                                                                                                                       // Récupération caractéristique RX

statusDiv.textContent = "Statut : Connecté !";                                                                                                                                                                 // Message si succès
statusDiv.style.color = "#28a745";                                                                                                                                                                             // Couleur verte
connectBtn.style.display = "none";                                                                                                                                                                             // Masque le bouton de connexion
} catch (error) {
console.error(error);                                                                                                                                                                                          // Affiche l'erreur en console
statusDiv.textContent = "Statut : Échec de la connexion";                                                                                                                                                      // Message si échec
}
});

let isDragging = false;                                                                                                                                                                                       // Indique si l'utilisateur glisse le joystick
const maxDelta = 60;                                                                                                                                                                                          // Amplitude maximale en pixels

function handleMove(clientX) {                                                                                                                                                                                // Fonction de calcul du mouvement
const rect = container.getBoundingClientRect();                                                                                                                                                               // Récupère les dimensions
const centerX = rect.left + rect.width / 2;                                                                                                                                                                   // Calcule le centre horizontal
let deltaX = clientX - centerX;                                                                                                                                                                               // Écart par rapport au centre

if (deltaX < -maxDelta) deltaX = -maxDelta;                                                                                                                                                                   // Limite gauche
if (deltaX > maxDelta) deltaX = maxDelta;                                                                                                                                                                     // Limite droite

joystick.style.transform = `translate(${deltaX}px, 0px)`;                                                                                                                                                     // Déplace visuellement le joystick

let angle = Math.round(90 + (deltaX / maxDelta) * 90);                                                                                                                                                        // Convertit en angle de 0 à 180°
angleValueSpan.textContent = angle;                                                                                                                                                                           // Met à jour l'affichage de l'angle

sendAngleToMicrobit(angle);                                                                                                                                                                                   // Envoie la valeur à la micro:bit
}

joystick.addEventListener('pointerdown', (e) => {                                                                                                                                                             // Quand on clique/touche le joystick
isDragging = true;                                                                                                                                                                                            // Active le mouvement
joystick.setPointerCapture(e.pointerId);                                                                                                                                                                      // Capture le pointeur tactile/souris
});

joystick.addEventListener('pointermove', (e) => {                                                                                                                                                             // Quand on déplace le pointeur
if (!isDragging) return;                                                                                                                                                                                      // Sort si non cliqué
handleMove(e.clientX);                                                                                                                                                                                        // Exécute le calcul de position
});

joystick.addEventListener('pointerup', (e) => {                                                                                                                                                               // Quand on relâche le joystick
isDragging = false;                                                                                                                                                                                           // Désactive le mouvement
joystick.style.transform = `translate(0px, 0px)`;                                                                                                                                                             // Remet le joystick au centre
angleValueSpan.textContent = 90;                                                                                                                                                                              // Remet l'affichage à 90°
sendAngleToMicrobit(90);                                                                                                                                                                                      // Envoie la position neutre (90°)
});

async function sendAngleToMicrobit(angle) {                                                                                                                                                                   // Fonction d'envoi Bluetooth
if (uartCharacteristic) {                                                                                                                                                                                     // Vérifie si la liaison est active
try {
const encoder = new TextEncoder();                                                                                                                                                                            // Prépare l'encodeur texte
await uartCharacteristic.writeValue(encoder.encode(angle + "
"));                                                                                                                                                                                                          // Envoie l'angle + retour à la ligne
} catch (error) {
console.error("Erreur d'envoi : ", error);                                                                                                                                                                    // Gestion des erreurs d'envoi
}
}
}
</script>
</body>
</html>
